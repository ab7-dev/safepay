services:
  - type: web
    name: safepay
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m core.seed && python train.py"
    startCommand: "gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATA_DIR
        value: ./data
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.8
